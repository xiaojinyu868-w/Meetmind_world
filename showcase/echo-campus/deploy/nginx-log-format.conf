# http level — install as /etc/nginx/conf.d/00-echo-campus-log.conf (must sort before the server that uses it).
# The map link 呆猫 opens carries an entry ticket (?ticket=, 30 min). /echo-campus/ logs the path only, and the
# referer without its query; everything else matches nginx.conf's "main".
map $http_referer $echo_campus_referer {
    default                         $http_referer;
    ""                              "-";
    "~^(?<echo_campus_ref>[^?]*)\?" "${echo_campus_ref}?-";
}
log_format echo_campus_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent "$echo_campus_referer" '
                               '"$http_user_agent" "$http_x_forwarded_for" '
                               'rt=$request_time uct="$upstream_connect_time" '
                               'uht="$upstream_header_time" urt="$upstream_response_time"';
