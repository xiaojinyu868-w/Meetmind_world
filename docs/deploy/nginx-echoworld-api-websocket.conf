# EchoWorld v1 房间 WebSocket 反代补丁（capture.meetmind.online）
#
# 背景：v1 现场房间用 WS /api/v1/rooms/{id}/stream 推送有序事件流
# （docs/MVP2-BACKEND.md，TBD-ARCH-4 现场档）。线上 nginx 的
# `location ^~ /echoworld/api/` 目前只设了 `proxy_set_header Connection "";`
# （keepalive 用法），没有 Upgrade 头，WebSocket 握手会被代理吃掉。
#
# 前端有降级：WS 握手失败会自动退到 GET /events?after_sequence=N 轮询，
# 功能等价、延迟约 1s。所以本补丁不是上线的阻塞项，但加上后现场体验明显更好。
#
# 改法（人工执行，AI 代理不 reload nginx）：
#   1. 文件顶部已有 map（如没有则补上）：
#
#      map $http_upgrade $meetmind_capture_connection_upgrade {
#          default upgrade;
#          '' close;
#      }
#
#   2. 把 `location ^~ /echoworld/api/` 块替换为下面这段（新增两行
#      Upgrade/Connection，并把原来的 `Connection "";` 去掉）：
#
#      location ^~ /echoworld/api/ {
#          proxy_pass http://127.0.0.1:8000/api/;
#          proxy_http_version 1.1;
#          proxy_set_header Upgrade $http_upgrade;
#          proxy_set_header Connection $meetmind_capture_connection_upgrade;
#          proxy_set_header Host $host;
#          proxy_set_header X-Real-IP $remote_addr;
#          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#          proxy_set_header X-Forwarded-Proto $scheme;
#          proxy_buffering off;
#          proxy_cache off;
#          proxy_read_timeout 3600s;
#          client_max_body_size 500m;
#      }
#
#   3. `nginx -t` 通过后 `systemctl reload nginx`。
#
# 验证：curl -i -N -H "Connection: Upgrade" -H "Upgrade: websocket" \
#   -H "Sec-WebSocket-Version: 13" -H "Sec-WebSocket-Key: x3JJHMbDL1EzLkh9GBhXDw==" \
#   "https://capture.meetmind.online/echoworld/api/v1/rooms/<room_id>/stream?after_sequence=0"
# 应返回 101 Switching Protocols（404 说明 room_id 不存在，先 POST 创建房间）。
