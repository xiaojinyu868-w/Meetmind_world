name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run shared experience contract
        run: python -m unittest discover -s examples/shared_experience -t . -v
      - name: Run backend tests
        working-directory: backend
        env:
          PHYSICAL_AI_PACKAGE_SCHEMA: ""
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Verify semantic lab
        run: |
          node --test examples/shared_experience/lab/scene.test.mjs
          npm exec vite build -- --config examples/shared_experience/lab/vite.config.js
