[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meetmind-world-core"
version = "0.1.0a1"
description = "Attributed experiences, semantic world changes and personal action outcomes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[tool.setuptools]
packages = ["meetmind_core"]
include-package-data = false
