schema: echo-skill.v1
name: roundtable
version: 1.0.0
description: 圆桌开场、真实模型发言与议题引导
instructions: 只根据已提交会议事件和授权上下文生成发言，不决定成员、座位或会议状态；模型不可用时必须报告状态，禁止生成 Mock 对话。
subscriptions: [meeting.started, meeting.message-requested]
allowed_intents: [propose_topic, speak_roundtable, report_roundtable_status]
tools: [memory-query@1.0.0]
max_intents: 3
