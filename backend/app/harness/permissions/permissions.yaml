# 自进化权限矩阵（docs/ARCHITECTURE.md §5）
# 修改本文件 = 代码评审级变更。
# harness（自进化流程）的每一次写入都必须经过 guard.py 校验：
# 目标在 allow 清单内且未被 deny 覆盖才放行，其余一律默认拒绝。
version: "echo-permissions.v1"

# 允许自进化更新
allow:
  - agent.position          # Agent 的位置
  - agent.state             # Agent 的状态
  - agent.current_task      # 当前任务状态
  - encounter_memory.append # 相遇记忆（新增条目，只增不改）
  - short_term_memory       # 短期工作记忆
  - user_feedback           # 用户反馈记录

# 禁止自进化更新（优先级高于 allow；长期记忆只能经用户确认流程写入）
deny:
  - skill.workflow          # Skill 工作流
  - tool.implementation     # Tool 全部实现
  - permissions.self        # 权限要求本身
  - long_term_memory        # 长期记忆（人物事实层）
  - api.config              # API 配置 / 密钥

# Agent Runtime 事件白名单（计划 §3.3）：runtime（含 LLM 决策）允许发布的事件
# 类型只有这些；LLM 产出白名单外的事件一律丢弃并记日志（guard.check_event）。
runtime_events:
  allow:
    - agent-move      # 移动（含坐标/朝向）
    - agent-state     # 状态切换（walking/seated/talking/in-meeting）
    - agent-talk      # 对话气泡（内容已由授权上下文过滤，≥ L2）
    - meeting-start   # 发起圆桌会议
    - meeting-end     # 结束圆桌会议
